      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap"
    />
    <!-- First visit to Home this session: start dark, so the entrance never flashes ivory before the film -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('tier');
          var still = q === 'still' || (q !== 'full' && q !== 'lighter' && matchMedia('(prefers-reduced-motion: reduce)').matches);
          if (location.pathname === '/' && !still && sessionStorage.getItem('gitaarth:entered') !== '1') document.documentElement.dataset.intro = 'on';
        } catch (e) { /* private mode: the page simply starts light */ }
      })();
    </script>
    <style>html[data-intro='on'], html[data-intro='on'] body { background: #020101; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
